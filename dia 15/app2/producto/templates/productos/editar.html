{% extends "base.html" %}


{% block title %}
Editar producto
{% endblock %}


{% block content %}


<div class="page-header">

    <div>

        <h1>
            Editar producto
        </h1>

        <p>
            {{ producto.descripcion }}
        </p>

    </div>

</div>


<div class="card">

    <form method="post">

        {% csrf_token %}


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Código de barra
                </label>

                <input
                    type="text"
                    name="codigo_barra"
                    value="{{ producto.codigo_barra }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Descripción
                </label>

                <input
                    type="text"
                    name="descripcion"
                    value="{{ producto.descripcion }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Precio costo
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="precio_costo"
                    value="{{ producto.precio_costo }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Precio venta
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="precio_venta"
                    value="{{ producto.precio_venta }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    IVA
                </label>

                <select name="iva">

                    <option
                        value="10"
                        {% if producto.iva == 10 %}
                        selected
                        {% endif %}
                    >
                        10%
                    </option>

                    <option
                        value="5"
                        {% if producto.iva == 5 %}
                        selected
                        {% endif %}
                    >
                        5%
                    </option>

                    <option
                        value="0"
                        {% if producto.iva == 0 %}
                        selected
                        {% endif %}
                    >
                        Exento
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Stock
                </label>

                <input
                    type="number"
                    min="0"
                    name="stock"
                    value="{{ producto.stock }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Unidad
                </label>

                <select name="unidad_medida">

                    <option
                        value="UNIDAD"
                        {% if producto.unidad_medida == "UNIDAD" %}
                        selected
                        {% endif %}
                    >
                        Unidad
                    </option>

                    <option
                        value="CAJA"
                        {% if producto.unidad_medida == "CAJA" %}
                        selected
                        {% endif %}
                    >
                        Caja
                    </option>

                    <option
                        value="PAQUETE"
                        {% if producto.unidad_medida == "PAQUETE" %}
                        selected
                        {% endif %}
                    >
                        Paquete
                    </option>

                    <option
                        value="KG"
                        {% if producto.unidad_medida == "KG" %}
                        selected
                        {% endif %}
                    >
                        Kilogramo
                    </option>

                    <option
                        value="LITRO"
                        {% if producto.unidad_medida == "LITRO" %}
                        selected
                        {% endif %}
                    >
                        Litro
                    </option>

                </select>

            </div>

        </div>


        <br>


        <button
            type="submit"
            class="btn btn-success"
        >
            Guardar cambios
        </button>


        <a
            href="{% url 'productos_index' %}"
            class="btn btn-secondary"
        >
            Cancelar
        </a>

    </form>

</div>


{% endblock %}
